    <!-- Optimization: 2 × 4 -->
    <rect class="lib-col" x="620" y="190" width="208" height="152" rx="8" stroke-width="1" />
    <rect class="lib-chip" x="632" y="202" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="676" y="219">EvoX</text>
    <rect class="lib-chip" x="632" y="236" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="676" y="253">EvoMO</text>
    <rect class="lib-chip" x="632" y="270" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="676" y="287">EvoGP</text>
    <rect class="lib-chip" x="632" y="304" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="676" y="321">MetaDE</text>
    <rect class="lib-chip" x="728" y="202" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="772" y="219">iStratDE</text>
    <rect class="lib-chip" x="728" y="236" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="772" y="253">AutoPSO</text>
    <rect class="lib-chip" x="728" y="270" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="772" y="287">EvoCmo</text>
    <rect class="lib-chip" x="728" y="304" width="88" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="772" y="321">EvoCoCo</text>
  </g>

  <g class="arrow-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="440" y1="362" x2="440" y2="376" /><polyline points="434,371 440,377 446,371" />
  </g>

  <!-- 3. Compiler & Runtime -->
  <rect class="runtime-box" x="32" y="384" width="816" height="132" rx="12" stroke-width="1.75" />
  <text class="font-sans runtime-title" x="440" y="410" text-anchor="middle">Compiler &amp; Runtime</text>

  <rect class="sub-box" x="52" y="424" width="500" height="76" rx="8" stroke-width="1" />
  <text class="font-sans sub-title" x="70" y="448">EvoX Compiler (evoxc)</text>
  <text class="font-sans sub-meta" x="70" y="468">Explicit tensor graph (EvoXIR)  ·  vmap / grad transforms  ·  StableHLO</text>
  <text class="font-sans sub-meta" x="70" y="487">Backends: numpy interpreter  ·  IREE  ·  XLA (PJRT)  ·  TVM</text>

  <rect class="sub-box" x="564" y="424" width="264" height="76" rx="8" stroke-width="1" />
  <text class="font-sans sub-title" x="582" y="448">Framework Runtimes</text>
  <text class="font-sans sub-meta" x="582" y="468">PyTorch  ·  JAX</text>
  <text class="font-sans sub-meta" x="582" y="487">used by current projects</text>

  <g class="arrow-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="440" y1="520" x2="440" y2="534" /><polyline points="434,529 440,535 446,529" />
  </g>

  <!-- 4. Hardware -->
  <rect class="layer-box" x="32" y="542" width="816" height="72" rx="10" stroke-width="1.25" />
  <text class="font-sans title-text" x="440" y="570" text-anchor="middle">Heterogeneous Hardware</text>
  <text class="font-sans meta-text" x="440" y="594" text-anchor="middle">CPU  ·  NVIDIA CUDA  ·  AMD ROCm  ·  Vulkan (ARM Mali · Adreno)  ·  Apple Silicon  ·  Huawei Ascend  ·  Clusters</text>

  <!-- Scope note -->
  <rect class="note-box" x="32" y="628" width="816" height="32" rx="8" stroke-width="1.25" stroke-dasharray="5 4" />
  <text class="font-sans note-text" x="440" y="649" text-anchor="middle">Projects are independent repositories; each states which runtime / compiler path and hardware it supports.</text>
</svg>
