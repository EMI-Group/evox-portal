    <rect class="lib-chip" x="348" y="236" width="106" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="401" y="253">EvoRL</text>
    <rect class="lib-chip" x="348" y="270" width="106" height="26" rx="6" stroke-width="1" />
