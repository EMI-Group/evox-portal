  <g class="font-sans" text-anchor="middle">
    <!-- Generative AI -->
    <rect class="lib-col" x="52" y="190" width="130" height="152" rx="8" stroke-width="1" />
    <rect class="lib-chip" x="64" y="219" width="106" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="117" y="236">EvoGM</text>
    <rect class="lib-chip" x="64" y="253" width="106" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="117" y="270">EvoNAS</text>
    <rect class="lib-chip" x="64" y="287" width="106" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="117" y="304">EvoXBench</text>

    <!-- Agentic AI -->
    <rect class="lib-col" x="194" y="190" width="130" height="152" rx="8" stroke-width="1" />
    <rect class="lib-chip" x="206" y="236" width="106" height="26" rx="6" stroke-width="1" />
    <text class="lib-text" x="259" y="253">Genesis</text>
    <rect class="lib-chip" x="206" y="270" width="106" height="26" rx="6" stroke-width="1" />
